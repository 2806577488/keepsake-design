function chatBar(title) {
  return '<div class="bar"><span class="ic">' + I.back(24) + '</span>' +
    '<h2 style="flex:0 1 auto;min-width:0">' + title + '</h2><span style="flex:1"></span>' +
    '<span class="ic">&#8942;</span></div>' +
    '<div class="subbar"><span>DeepSeek · deepseek-flash</span>' + I.down(14) + '</div>';
}
function usage(extra) {
  return '<div class="usage">' + I.eq(16) + '<span>本会话 占用 <b>10%</b> · 缓存命中 <b>33%</b></span>' +
    '<span class="r">' + (extra || '1.3万 / 12.8万') + '</span></div>';
}
function chips(mode) {
  const on = '<span class="chip on">';
  const off = '<span class="chip">';
  let h = '<div class="chips">';
  h += mode === 'off' ? off + I.globe(15) + '联网搜索：关</span>' : on + I.globe(15) + '联网搜索：开</span>';
  h += on + I.bulb(15) + '深度思考：开（高）</span>';
  h += off + I.clock(15) + '上下文：最近 20 轮</span>';
  h += off + I.plus(13) + '添加附件</span>';
  return h + '</div>';
}
function inputbar(kind) {
  let right;
  if (kind === 'stop') right = '<span class="send stop">' + I.stop(18) + '</span>';
  else if (kind === 'dis') right = '<span class="send dis">' + I.up(18) + '</span>';
  else right = '<span class="send">' + I.up(18) + '</span>';
  return '<div class="inputbar"><span class="plus">' + I.plus(22) + '</span>' +
    '<span class="field">发消息…</span><span class="mic">' + I.mic(22) + '</span>' + right + '</div>';
}
function composer(kind, chipMode) {
  return '<div class="composer">' + chips(chipMode || 'on') + inputbar(kind) + '</div>';
}

const CODE = '<div class="code"><div class="h"><span>python</span>' + I.copy(15) + '</div>' +
  '<div class="b"><span class="kw">from</span> pathlib <span class="kw">import</span> Path\n' +
  'files = <span class="fn">sorted</span>(Path(<span class="st">"."</span>).<span class="fn">glob</span>(<span class="st">"*"</span>))\n' +
  '<span class="kw">for</span> i, f <span class="kw">in</span> <span class="fn">enumerate</span>(files, <span class="st">1</span>):\n' +
  '    f.<span class="fn">rename</span>(f<span class="st">"_"</span> + f.name)</div></div>';

function acts(dim) {
  const it = (icon, label, extra) => '<span class="t"' + (extra || '') + '>' + icon + '<em>' + label + '</em></span>';
  return '<div class="msgacts">' +
    it(I.speak(15), '朗读') +
    it(I.copy(15), '复制') +
    it(I.redo(15), '重答', dim ? ' style="opacity:.4"' : '') +
    it(I.branch(15), '分支') +
    '</div>';
}
