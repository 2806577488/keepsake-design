  share: function (s) { return svg('M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z', s); },
  trash: function (s) { return svg('M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z', s); },

  warn: function (s) { return svg('M12 5.99L19.53 19H4.47L12 5.99M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z', s); },
  sliders: function (s) { return svg('M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z', s, 'solid'); },

const ROWS = [
  ['pin', '帮我写一个 Python 脚本，批量重命名', '5 天前 · 10 个对话'],
  ['chat', '用三句话解释一下量子纠缠', '2 小时前 · 4 个对话'],
  ['chat', '帮我把下面这段话润色一下', '昨天 · 6 个对话'],
  ['chat', '雨天骑行装备清单', '11 月 18 日 · 8 个对话'],
  ['chat', '周末去哪儿吃饭', '11 月 16 日 · 3 个对话'],
  ['chat', '给妈妈写一条生日祝福', '11 月 14 日 · 0 个对话']
];

function rowHtml(r, i, sel) {
  const pin = r[0] === 'pin';
  const av = '<span class="av' + (pin ? ' pin' : '') + '">' + (pin ? ICON.pin(16) : ICON.chat(16)) + '</span>';
  const lead = sel ? '<span class="slot"><span class="cb' + (r[3] ? ' on' : '') + '">' + (r[3] ? '✓' : '') + '</span></span>' : av;
  const more = sel ? '' : '<span class="more">&#8942;</span>';
  return '<div class="row' + (sel && r[3] ? ' on' : '') + ' line">' + lead +
    '<div class="rb"><div class="rt">' + r[1] + '</div><div class="rm">' + r[2] + '</div></div>' + more + '</div>';
}

// ── 列表改造版：分组 + 右侧时间 + 未读点 + 当前行强标 ──────
const ROWS2 = [
  { g:'今天', icon:'pin',  t:'帮我写一个 Python 脚本，批量重命名', m:'10 个对话', time:'14:32', unread:true,  active:true  },
  { g:'今天', icon:'chat', t:'用三句话解释一下量子纠缠',           m:'4 个对话',  time:'09:15', unread:false, active:false },
  { g:'昨天', icon:'chat', t:'帮我把下面这段话润色一下',           m:'6 个对话',  time:'昨天',  unread:false, active:false },
  { g:'本周', icon:'chat', t:'雨天骑行装备清单',                  m:'8 个对话',  time:'11/18', unread:false, active:false },
  { g:'本周', icon:'chat', t:'周末去哪儿吃饭',                    m:'3 个对话',  time:'11/16', unread:false, active:false },
  { g:'本月', icon:'chat', t:'给妈妈写一条生日祝福',              m:'0 个对话',  time:'11/14', unread:false, active:false }
];

function rowHtml2(r, i) {
  const pin = r.icon === 'pin';
  const av = '<span class="av' + (pin ? ' pin' : '') + (r.active ? ' act' : '') + '">' +
             (pin ? ICON.pin(16) : ICON.chat(16)) + '</span>';
  const cls = 'lr line' + (r.active ? ' act' : '') + (r.press ? ' press' : '');
  const dot = r.unread ? '<span class="udot"></span>' : '';
  return '<div class="' + cls + '">' + av +
    '<div class="rb"><div class="rtw"><div class="rt">' + r.t + '</div>' + dot + '</div>' +
    '<div class="rmrow"><span class="rm">' + r.m + '</span>' +
    '<span class="rtime">' + (r.time || '') + '</span></div></div>' +
    '<span class="more">&#8942;</span></div>';
}

function rowHtml2Sel(r, i) {
  const slot = '<span class="slot"><span class="cb' + (r.picked ? ' on' : '') + '">' +
               (r.picked ? '✓' : '') + '</span></span>';
  return '<div class="lr line' + (r.picked ? ' on' : '') + '">' + slot +
    '<div class="rb"><div class="rtw"><div class="rt">' + r.t + '</div></div>' +
    '<div class="rmrow"><span class="rm">' + r.m + '</span>' +
    '<span class="rtime">' + (r.time || '') + '</span></div></div></div>';
}

function barNormal() {
  return '<div class="bar"><span class="ic">' + ICON.checklist(24) + '</span><h2>留声</h2>' +
    '<span class="ic">' + ICON.search(24) + '</span><span class="ic">' + ICON.settings(24) + '</span></div>';
}
function barBack(t) {
  return '<div class="bar"><span class="ic">' + ICON.back(24) + '</span><h2>' + t + '</h2>' +
    '<span class="ic">' + ICON.sliders(24) + '</span><span class="ic">&#8942;</span></div>';
}

const S = {};

S['列表 · 正常'] = barNormal() +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  ROWS2.map(function (r, i) {
    var head = (i === 0 || ROWS2[i - 1].g !== r.g) ? '<div class="grp">' + r.g + '</div>' : '';
    return head + rowHtml2(r, i);
  }).join('') +
  '</div><button class="fab">＋ 新对话</button>';

S['列表 · 空态'] = barNormal() +
  '<div class="center"><span class="bigmark">' + ICON.chat(26) + '</span>' +
  '<h3>还没有会话</h3><p>点右下角「新对话」开始，<br>或从设置里导入 DeepSeek 的导出包</p></div>' +
  '<button class="fab">＋ 新对话</button>';

S['列表 · 加载中'] = barNormal() +
  '<div class="center"><div class="spin"></div></div>';

S['列表 · 加载失败'] = barNormal() +
  '<div class="center"><span class="bigmark" style="color:var(--err-c)">' + ICON.warn(26) + '</span>' +
  '<h3>加载失败</h3><p>SQLITE_BUSY: database is locked</p>' +
  '<span class="retry">重试</span></div>';

S['列表 · 搜索'] =

  '<span class="searchfield">' + ICON.search(18) + '<span style="flex:1">量子</span>' + ICON.x(16) + '</span>' +
  '<span class="ic"></span></div>' +
  '<div class="scroll" style="flex:1;overflow:hidden">' +

  '<div class="row"><span class="av">' + ICON.search(16) + '</span><div class="rb">' +

  '<div class="row"><span class="av">' + ICON.chat(16) + '</span><div class="rb">' +

  '<div class="rm">雨天骑行装备清单 · 11 月 18 日</div></div></div>' +
  '<div class="row"><span class="av">' + ICON.chat(16) + '</span><div class="rb">' +
  '<div class="rt">…把量子纠缠类比成两只手套，分开打包后打开一只就知道另一只…</div>' +
  '<div class="rm">周末去哪儿吃饭 · 11 月 16 日</div></div></div>' +
  '</div>';

S['列表 · 导入中'] = barNormal() +

S['列表 · 导入失败'] = barNormal() +

  '<span class="ops"><span class="btn">重试没导上的</span><span class="x">' + ICON.x(16) + '</span></span></div>' +

  ROWS.slice(0, 5).map(function (r, i) { return rowHtml(r, i, false); }).join('') + '</div>' +
  '<button class="fab">＋ 新对话</button>';

function multiBar(n, allOn) {
  const dis = n === 0;
  return '<div class="bar"><span class="ic">' + ICON.x(24) + '</span>' +
    '<span class="sel">已选 ' + n + '</span>' +
    '<span class="ic">' + ICON.selectall(24) + '</span>' +
    '<span class="ic' + (dis ? ' mute' : '') + '">' + ICON.share(24) + '</span>' +
    '<span class="ic" style="color:' + (dis ? 'var(--on-v)' : '#BA1A1A') + ';' + (dis ? 'opacity:.38' : '') + '">' + ICON.trash(24) + '</span></div>';
}

function pickRows(onIdx) {
  return ROWS2.slice(0, 5).map(function (r, i) {
    var c = Object.assign({}, r);
    c.picked = onIdx.indexOf(i) >= 0;
    c.active = false;
    return c;
  });
}
const mrows2 = pickRows([0, 2]);
const nrows2 = pickRows([]);

  mrows2.map(function (r, i) { return rowHtml2Sel(r, i); }).join('') + '</div>';

  '<div class="scroll" style="flex:1;overflow:hidden">' +
  nrows2.map(function (r, i) { return rowHtml2Sel(r, i); }).join('') + '</div>';

S['列表 · ⋮ 菜单'] = barNormal() +

  '<div style="font-size:15px;font-weight:var(--title-w);color:var(--on-s)">用三句话解释一下量子纠缠</div>' +

  '<div class="row2"><span style="color:var(--on-v)">' + ICON.checklist(20) + '</span><div class="t">重命名</div></div>' +
  '<div class="row2"><span style="color:var(--on-v)">' + ICON.pin(20) + '</span><div class="t">置顶</div></div>' +
  '<div class="row2"><span style="color:var(--on-v)">' + ICON.chat(20) + '</span><div class="t">为缺少角色卡的会话补建<span class="d">按话题自动建卡</span></div></div>' +
  '<div class="row2" style="color:var(--err-c)"><span>' + ICON.trash(20) + '</span><div class="t">删除会话</div></div>' +
  '</div></div>';

S['列表 · 左滑删除'] = barNormal() +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  rowHtml(ROWS[0], 0, false) +
  '<div class="row line" style="padding-right:104px"><span class="av">' + ICON.chat(16) + '</span>' +
  '<div class="rb"><div class="rt">用三句话解释一下量子纠缠</div><div class="rm">2 小时前 · 4 个对话</div></div>' +
  '<div style="position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--err-bg);color:var(--err-c);display:grid;place-items:center">' +
  ICON.trash(22) + '</div></div>' +
  ROWS.slice(2, 5).map(function (r, i) { return rowHtml(r, i + 2, false); }).join('') +
  '</div><button class="fab">＋ 新对话</button>';

S['多选 · 删除确认'] = multiBar(2, true) +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  mrows2.map(function (r, i) { return rowHtml2Sel(r, i); }).join('') + '</div>' +
  '<div class="scrim"></div>' +
  '<div class="dialog"><h4>删除会话</h4>' +
  '<p>删除选中的 2 个会话？删掉的会话和它们的消息都无法恢复。</p>' +
  '<div class="acts"><span class="btn" style="color:var(--on-v)">取消</span>' +
  '<span class="btn red">删除 2 个</span></div></div>';

/* ── 渲染 ── */
const ORDER = only ? [only] : ['a', 'e', 'h'];
const root = document.getElementById('root');

ORDER.forEach(function (key) {
  const s = SKINS[key];
  const vars = Object.assign({}, base, s.v);
  const css = Object.keys(vars).map(function (k) { return k + ':' + vars[k]; }).join(';');

  if (!only) {
    const h = document.createElement('div');
    h.className = 'set-head';
    h.innerHTML = '<h2>' + s.name + '</h2><p>' + s.desc + '</p>';
    root.appendChild(h);
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  Object.keys(S).forEach(function (label) {
    const box = document.createElement('div');
    box.className = 'wrap';
    box.innerHTML = '<p class="cap">' + label + '</p>' +
      '<div class="phone" data-ic="' + (s.icons || 'filled') + '" style="' + css + '">' + S[label] + '</div>';
    grid.appendChild(box);
  });
  root.appendChild(grid);
});
</script>
</body>
</html>
