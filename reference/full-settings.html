<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Keepsake · 设置与弹层</title>
<link rel="stylesheet" href="full.css">
</head>
<body>
<div class="head">
  <h1>设置 · 6 个屏</h1>
  <p>设置上半（AI 平台 + 对话默认）/ 设置下半（用量 + 后台任务 + 外观 + 数据 + 关于）/ 思考强度 / 导出 / 平台编辑 / 模型选择。411dp × 892dp。</p>
</div>
<div id="root"></div>

<script>
const q = new URLSearchParams(location.search);
const only = q.get('set');
const MONO = "ui-monospace, 'Cascadia Mono', Consolas, 'Noto Sans Mono CJK SC', monospace";

const base = {
  '--surface':'#F5FBF7','--low':'#EFF5F2','--high':'#E3EAE6','--highest':'#DEE4E1','--usage':'#E9EFEC',
  '--ov':'#CAD1CD','--outline':'#7C8B86','--on-s':'#191C1B','--on-v':'#496F66',
  '--code-bg':'#FFFFFF','--code-head':'#E7F3EF','--code-div':'#D5EAE3','--code-fg':'#161B1A',
  '--sel-line':'rgba(4,107,92,.45)','--sel-bg':'#D9F6EC','--sel-bar':'#046B5C',
  '--p-c':'#A0F2DF','--on-p-c':'#005045','--send-bg':'#A0F2DF','--send-fg':'#005045',
  '--ai-bg':'#EFF5F2','--ai-fg':'#191C1B','--av-bg':'#DEE4E1','--av-fg':'#496F66',
  '--err-c':'#BA1A1A','--on-err-c':'#FFFFFF','--err-bg':'#FFDAD6','--on-err-bg':'#410002','--fab-line':'#8CCDBB','--code-kw':'#A626A4','--code-str':'#50A14F','--code-fn':'#4078F2',
  '--meta-font':'inherit','--meta-ls':'0','--title-w':'600','--title-ls':'0',
  '--lh':'1.6','--icon-c':'#191C1B','--tail':'4px','--sw-r':'12px','--sw-knob':'9px',
  '--r-bubble':'16px','--r-fab':'16px','--r-card':'14px','--r-sheet':'24px',
  '--r-chip':'999px','--r-field':'999px','--r-send':'999px','--r-cb':'6px','--r-radio':'999px',
  '--row-h':'68px','--gap':'12px','--av-r':'17px','--mark-r':'32px',
  '--fs-body':'15px','--fs-title':'16px','--fs-sub':'13px','--fs-bar':'20px',
  '--card-bd':'0px','--card-bg':'var(--low)','--field-bg':'var(--highest)'
};

const SKINS = {
  a: { name:'A 清透 · Material 圆润', desc:'无衬线 + 大圆角 + 胶囊 + 实心图标。', v:{} },
  e: { name:'E 纸感 · 瑞士编辑风', desc:'衬线正文、元信息等宽、小圆角、线性图标、卡片只用 1px 线。', icons:'outlined', size:24, v:{
      '--r-bubble':'8px','--r-fab':'6px','--r-card':'6px','--r-sheet':'14px',
      '--r-chip':'3px','--r-field':'6px','--r-send':'6px','--r-cb':'3px','--r-radio':'3px',
      '--row-h':'68px','--gap':'10px','--av-r':'17px','--mark-r':'8px',
      '--fs-body':'16px','--fs-title':'16px','--fs-sub':'12.5px','--fs-bar':'20px',
      '--card-bd':'1px','--card-bg':'var(--surface)','--field-bg':'var(--surface)',
      '--meta-font':MONO,'--meta-ls':'0.02em','--title-w':'700','--title-ls':'0.005em','--lh':'1.7',
      '--sw-r':'2px','--sw-knob':'2px','--tail':'0px',
      '--body-font':'Songti SC, Noto Serif CJK SC, Source Han Serif SC, SimSun, serif',
      '--surface':'#FDFCF9','--low':'#F1EDE4','--high':'#E8E2D6','--ov':'#D8D4CC',
      '--on-s':'#1A1A18','--on-v':'#5C5A54',
      '--p-c':'#F2D9C4','--on-p-c':'#5A2E14','--send-bg':'#B4481B','--send-fg':'#FFFFFF',
      '--sel-bg':'#F0E4D6','--sel-bar':'#B4481B','--sel-line':'rgba(180,72,27,.5)','--ai-bg':'#F1EDE4','--ai-fg':'#1A1A18'
  }},
  h: { name:'H 墨色 · 工具高对比', desc:'字号更大、字重更重、深青实心块面、图标 26。', v:{
      '--r-bubble':'14px','--r-fab':'14px','--r-card':'12px','--r-sheet':'24px',
      '--r-chip':'8px','--r-field':'12px','--r-send':'12px','--r-cb':'5px','--r-radio':'6px',
      '--row-h':'68px','--fs-body':'16px','--fs-title':'17px','--fs-sub':'13px','--fs-bar':'22px',
      '--title-w':'700','--title-ls':'-0.005em','--lh':'1.55','--icon-c':'#1F4A42',
      '--send-bg':'#1F4A42','--send-fg':'#A7E6D5',
      '--ai-bg':'#EFF5F2','--ai-fg':'#191C1B','--av-bg':'#1F4A42','--av-fg':'#A7E6D5'
  }}
};

function svg(d, size, mode) {
  return '<svg class="mi' + (mode ? ' mi-' + mode : '') + '" viewBox="0 0 24 24" width="' + size +
    '" height="' + size + '"><path d="' + d + '"/></svg>';
}
const I = {
  back: function (s) { return svg('M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z', s); },
  chev: function (s) { return svg('M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z', s); },
  cloud: function (s) { return svg('M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z', s, 'solid'); },
  badge: function (s) { return svg('M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z', s, 'solid'); },
  warn: function (s) { return svg('M12 5.99L19.53 19H4.47L12 5.99M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z', s); },
  card: function (s) { return svg('M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z', s); },
  down: function (s) { return svg('M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z', s); },
  up: function (s) { return svg('M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z', s); },
  x: function (s) { return svg('M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z', s); },
  share: function (s) { return svg('M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z', s); },
  save: function (s) { return svg('M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z', s); },
  gear: function (s) { return svg('M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z', s, 'solid'); },
  info: function (s) { return svg('M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z', s); },
};

function setBar(t) {
  return '<div class="bar"><span class="ic">' + I.back(24) + '</span><h2>' + t + '</h2><span style="flex:1"></span></div>';
}
function tile(main, sub, right, cls) {
  return '<div class="tile' + (cls ? ' ' + cls : '') + '"><span class="tl">' + main +
    (sub ? '<span class="tsub">' + sub + '</span>' : '') + '</span>' +
    (right === undefined ? '' : right) + '</div>';
}
function chev() { return '<span class="val">' + I.chev(16) + '</span>'; }
function swOn() { return '<span class="sw on"><i></i></span>'; }
function swOff() { return '<span class="sw"><i></i></span>'; }

const S = {};

S['设置 · 上半（AI 平台 + 对话默认）'] = setBar('设置') +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  '<div class="sec">AI 平台</div>' +
  tile('DeepSeek 官方', 'deepseek-flash · 支持思考与联网', chev()) +
  tile('＋ 添加平台', null, '', '') .replace('class="tile', 'style="color:var(--sel-bar);font-weight:700" class="tile') +
  '<div class="sec">对话默认</div>' +
  '<div style="padding:0 20px 8px;font-size:12px;color:var(--on-v);line-height:1.5;font-family:var(--meta-font)">' +
  '这里只改<b>新会话</b>的默认值。聊天页的芯片改的是当前会话，不会写回这里。</div>' +
  tile('系统提示词', '留空则使用默认提示词', chev()) +
  tile('上下文预算', null, '<span class="val">本次 20 轮</span>' + chev()) +
  tile('思考强度', null, '<span class="val">中</span>' + chev()) +
  tile('深度思考', null, swOn()) +
  tile('联网搜索', null, swOn()) +
  tile('记忆与回忆', null, swOn()) +
  tile('情绪', null, swOff()) +
  tile('人格', null, swOn()) +
  tile('清空记忆数据', '重置所有角色卡的记忆与情绪', '', 'danger') +
  '</div>';

S['设置 · 下半（用量 + 后台任务 + 数据）'] = setBar('设置') +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  '<div class="sec">用量</div>' +
  '<div class="stats">' +
  '<div class="stat"><div class="k">本机合计</div><div class="v">128.4万</div></div>' +
  '<div class="stat"><div class="k">缓存命中</div><div class="v">33%</div></div>' +
  '</div>' +
  tile('按会话查看用量', null, chev()) +
  tile('余额', null, '<span class="val">—</span>') +
  tile('上下文窗口', '影响占用率的分母', '<span class="val">128k</span>' + chev()) +
  '<div class="sec">后台任务</div>' +
  '<div class="prog" style="border-bottom:1px solid var(--ov)"><div class="t">' + I.cloud(18) +
  '<b>正在导入 12 / 300</b><span class="cancel">取消</span></div>' +
  '<div class="bar3"><i style="width:4%"></i></div><div class="sub">雨天骑行装备清单 · 已完成 11</div></div>' +
  '<div class="prog" style="border-bottom:1px solid var(--ov)"><div class="t">' + I.badge(18) +
  '<b>正在补建角色卡：48 / 120</b></div>' +
  '<div class="bar3"><i style="width:40%"></i></div></div>' +
  tile(I.warn(18) + ' 有 7 条没导上', '上次导入留下的失败记录', '<span class="val" style="color:var(--err-c)">重试</span>', '') +
  '<div class="sec">外观</div>' +
  tile('主题', null, '<span class="val">跟随系统</span>' + chev()) +
  '<div class="sec">数据</div>' +
  '<div style="padding:0 20px 8px;font-size:12px;color:var(--on-v);line-height:1.5">数据全部存在本机，不上传云端。</div>' +
  tile('角色卡', '按角色隔离记忆、情绪、人格', chev()) +
  tile('导入历史对话', '选 ZIP / 粘贴链接 / 发现下载链接', chev()) +
  tile('导出备份', '导出全部会话为 ZIP', chev()) +
  '<div class="sec">关于</div>' +
  tile('Keepsake（留声）', '版本号以工程发行说明为准 · 数据全部存在本机', '') +
  '</div>';

function sheet(title, body) {
  return setBar('设置') + '<div class="scroll" style="flex:0 0 auto"></div>' +
    '<div class="scrim"></div><div class="sheet"><div class="handle"></div><h4>' + title + '</h4>' + body + '</div>';
}

S['弹层 · 思考强度'] = sheet('思考强度',
  '<div class="item"><span class="mark2"></span><span class="nm">低</span><span class="sub">更快、更省，适合日常问答</span></div>' +
  '<div class="item sel"><span class="mark2"></span><span class="nm">中</span><span class="sub">默认，平衡速度与推理</span></div>' +
  '<div class="item"><span class="mark2"></span><span class="nm">高</span><span class="sub">给更多思考预算，适合难题 / 写作</span></div>');

S['弹层 · 导出'] = sheet('导出 2 个会话',
  '<div class="sheetacts">' +
  '<div class="row2"><span style="color:var(--sel-bar)">' + I.save(22) + '</span><div class="t">存到手机<span class="d">选目录保存 ZIP，离线备份</span></div></div>' +
  '<div class="row2"><span style="color:var(--sel-bar)">' + I.share(22) + '</span><div class="t">分享<span class="d">发到微信 / 网盘等别的 App</span></div></div>' +
  '<div class="row2" style="justify-content:center;color:var(--on-v)">取消</div>' +
  '</div>');

S['弹层 · 平台编辑'] = setBar('添加平台') +
  '<div class="scroll" style="flex:1;overflow:hidden">' +
  '<div class="fieldrow"><span style="width:64px">名称</span><span class="in">My DeepSeek</span></div>' +
  '<div class="fieldrow"><span style="width:64px">Base URL</span><span class="in">https://api.deepseek.com</span></div>' +
  '<div class="fieldrow"><span style="width:64px">API Key</span><span class="in">sk-••••••••••••3f2a</span></div>' +
  '<div class="fieldrow"><span style="width:64px">协议</span><span class="in">OpenAI 兼容 ›</span></div>' +
  '<div class="fieldrow"><span style="width:64px">模型</span><span class="in">deepseek-chat ›</span></div>' +
  '<div class="sec" style="padding-top:12px">能力开关</div>' +
  tile('支持推理', null, swOn()) +
  tile('支持联网', null, swOn()) +
  tile('支持思考', null, swOn()) +
  tile('支持附件', '仅 DeepSeek Files API', swOff()) +
  '</div>' +
  '<div class="dialog" style="top:auto;bottom:16px;transform:none;left:16px;right:16px">' +
  '<div class="acts"><span class="btn" style="color:var(--on-v)">取消</span>' +
  '<span class="btn red" style="background:var(--sel-bar);color:#FFFFFF">保存</span></div></div>';

S['弹层 · 模型选择'] = setBar('批量重命名脚本') +
  '<div class="scroll" style="flex:0 0 auto"></div>' +
  '<div class="scrim"></div><div class="sheet"><div class="handle"></div><h4>选择平台与模型</h4>' +
  '<div class="item sel"><span class="mark2"></span><span class="nm" style="width:auto">DeepSeek 官方</span>' +
  '<span class="grow"></span><span class="right">deepseek-chat</span></div>' +
  '<div class="item"><span class="mark2"></span><span class="nm" style="width:auto">My DeepSeek</span>' +
  '<span class="grow"></span><span class="right">deepseek-reasoner</span></div>' +
  '<div class="item"><span class="mark2"></span><span class="nm" style="width:auto">本地 Ollama</span>' +
  '<span class="grow"></span><span class="right">qwen2.5</span></div>' +
  '<div style="padding:6px 20px 0;font-size:12px;color:var(--on-v);line-height:1.5">只影响当前会话，不改全局设置。</div>' +
  '</div>';

const ORDER = only ? [only] : ['a', 'e', 'h'];
const root = document.getElementById('root');
ORDER.forEach(function (key) {
  const s = SKINS[key];
  const vars = Object.assign({}, base, s.v);
  const css = Object.keys(vars).map(function (k) { return k + ':' + vars[k]; }).join(';');
  if (!only) {
    const h = document.createElement('div');
    h.className = 'set-head';
    h.innerHTML = '<h2>' + s.name + '</h2><p>' + s.desc + '</p>';
    root.appendChild(h);
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  Object.keys(S).forEach(function (label) {
    const box = document.createElement('div');
    box.className = 'wrap';
    box.innerHTML = '<p class="cap">' + label + '</p>' +
      '<div class="phone" data-ic="' + (s.icons || 'filled') + '" style="' + css + '">' + S[label] + '</div>';
    grid.appendChild(box);
  });
  root.appendChild(grid);
});
</script>
</body>
</html>
